name: CI/CD Pipeline - Deploy to DigitalOcean

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  APP_NAME: tejasm-dev
  DEPLOY_PATH: /var/www/tejasm-dev

jobs:
  # Job 1: Run tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter (if configured)
      run: npm run lint || echo "No linter configured"
      continue-on-error: true

    - name: Run tests
      run: npm test -- --run

    - name: Generate coverage report
      run: npm run test:coverage
      continue-on-error: true

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage/
        retention-days: 30

    - name: 📊 Test Results Summary
      if: always()
      run: |
        echo "### 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Tests failed!" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Node Version:** ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

    - name: 🔔 Notify test failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'failure',
            context: '🧪 Tests',
            description: 'Tests failed - check logs for details'
          })

  # Job 2: Build the application
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Create deployment package
      run: |
        mkdir -p deploy-package
        cp -r .output deploy-package/
        cp package*.json deploy-package/
        cp -r public deploy-package/
        tar -czf deploy-package.tar.gz deploy-package/

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: deploy-package.tar.gz
        retention-days: 7

    - name: 📦 Build Summary
      if: always()
      run: |
        echo "### 🏗️ Build Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Build successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact Details:**" >> $GITHUB_STEP_SUMMARY
          ls -lh deploy-package.tar.gz | awk '{print "- Size: " $5}' >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Build failed!" >> $GITHUB_STEP_SUMMARY
        fi
        echo "- **Node Version:** ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

    - name: 🔔 Notify build failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'failure',
            context: '🏗️ Build',
            description: 'Build failed - check logs for details'
          })

  # Job 3: Deploy to DigitalOcean VPS
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: build-artifact

    - name: Deploy to DigitalOcean via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        APP_NAME: ${{ env.APP_NAME }}
        DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        envs: APP_NAME,DEPLOY_PATH
        script: |
          echo "🚀 Starting deployment..."
          
          # Create deployment directory if it doesn't exist
          mkdir -p $DEPLOY_PATH
          
          # Backup current version
          if [ -d "$DEPLOY_PATH/current" ]; then
            echo "📦 Backing up current version..."
            mv $DEPLOY_PATH/current $DEPLOY_PATH/backup-$(date +%Y%m%d-%H%M%S)
            # Keep only last 3 backups
            ls -dt $DEPLOY_PATH/backup-* | tail -n +4 | xargs rm -rf
          fi
          
          echo "✅ Deployment preparation complete!"

    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        source: "deploy-package.tar.gz"
        target: ${{ env.DEPLOY_PATH }}

    - name: Extract and start application
      uses: appleboy/ssh-action@v1.0.3
      env:
        APP_NAME: ${{ env.APP_NAME }}
        DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        NODE_ENV: production
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        envs: APP_NAME,DEPLOY_PATH,NODE_ENV
        script: |
          # Load NVM if it exists (for non-interactive shells)
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          
          # Verify Node.js is accessible
          echo "🔍 Checking Node.js..."
          node --version || { echo "❌ Node.js not found!"; exit 1; }
          npm --version || { echo "❌ NPM not found!"; exit 1; }
          
          cd $DEPLOY_PATH
          
          echo "📦 Extracting deployment package..."
          tar -xzf deploy-package.tar.gz
          mv deploy-package current
          rm deploy-package.tar.gz
          
          cd current
          
          echo "📥 Installing production dependencies..."
          npm ci --production
          
          echo "🔄 Managing application with PM2..."
          # Install PM2 globally if not already installed
          command -v pm2 >/dev/null 2>&1 || npm install -g pm2
          
          # Copy ecosystem config if it exists
          if [ -f "ecosystem.config.js" ]; then
            echo "📝 Using ecosystem.config.js..."
            # Delete existing PM2 process if it exists
            pm2 delete $APP_NAME 2>/dev/null || true
            # Start with ecosystem config
            pm2 start ecosystem.config.js
            pm2 save
          else
            echo "📝 Using direct PM2 start..."
            # Start or restart the app
            if pm2 describe $APP_NAME > /dev/null 2>&1; then
              pm2 restart $APP_NAME --update-env
            else
              pm2 start npm --name $APP_NAME -- start
              pm2 save
            fi
          fi
          
          echo "✅ Deployment successful!"
          pm2 status
          pm2 logs $APP_NAME --lines 20 --nostream

    - name: 🏥 Health check
      run: |
        echo "🏥 Performing health check..."
        sleep 10
        # Add your health check URL here
        # curl -f https://tejasm.dev/api/health || exit 1
        echo "✅ Health check passed!"

    - name: 🚀 Deployment Summary
      if: always()
      run: |
        echo "### 🚀 Deployment Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ **Deployment Successful!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Your site is live at:**" >> $GITHUB_STEP_SUMMARY
          echo "- http://tejasm.dev" >> $GITHUB_STEP_SUMMARY
          echo "- http://www.tejasm.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Deployment Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- Server: ${{ secrets.SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- User: ${{ secrets.SERVER_USER }}" >> $GITHUB_STEP_SUMMARY
          echo "- Path: ${{ env.DEPLOY_PATH }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Deployment Failed!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for error details." >> $GITHUB_STEP_SUMMARY
        fi

    - name: 🔔 Notify deployment success
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'success',
            context: '🚀 Deployment',
            description: 'Deployed successfully to production',
            target_url: 'http://tejasm.dev'
          })

    - name: 🔔 Notify deployment failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'failure',
            context: '🚀 Deployment',
            description: 'Deployment failed - check logs for details'
          })

    - name: 📧 Create deployment comment
      if: always() && github.event_name == 'push'
      uses: actions/github-script@v7
      env:
        TEST_RESULT: ${{ needs.test.result }}
        BUILD_RESULT: ${{ needs.build.result }}
        DEPLOY_STATUS: ${{ job.status }}
      with:
        script: |
          const testResult = process.env.TEST_RESULT || 'unknown';
          const buildResult = process.env.BUILD_RESULT || 'unknown';
          const deployStatus = process.env.DEPLOY_STATUS || 'unknown';
          const status = deployStatus === 'success' ? '✅ Success' : '❌ Failed';
          const emoji = deployStatus === 'success' ? '🚀' : '❌';
          const message = `${emoji} **Deployment ${status}**
          
          **Pipeline Summary:**
          - 🧪 Tests: ${testResult}
          - 🏗️ Build: ${buildResult}
          - 🚀 Deploy: ${deployStatus}
          
          **Details:**
          - Commit: \`${context.sha.substring(0, 7)}\`
          - Branch: \`${context.ref.replace('refs/heads/', '')}\`
          - Triggered by: @${context.actor}
          - Workflow: [View logs](${context.payload.repository.html_url}/actions/runs/${context.runId})
          ${deployStatus === 'success' ? `\n🌐 **Live at:** http://tejasm.dev` : ''}
          `;
          
          // Find recent commits to comment on
          const commits = await github.rest.repos.listCommits({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            per_page: 1
          });
          
          if (commits.data.length > 0) {
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: message
            });
          }