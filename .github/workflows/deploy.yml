name: CI/CD Pipeline - Deploy to DigitalOcean

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  APP_NAME: tejasm-dev
  DEPLOY_PATH: /var/www/tejasm-dev

jobs:
  # Job 1: Run tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter (if configured)
      run: npm run lint || echo "No linter configured"
      continue-on-error: true

    - name: Run tests
      run: npm test -- --run

    - name: Generate coverage report
      run: npm run test:coverage
      continue-on-error: true

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage/
        retention-days: 30

  # Job 2: Build the application
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Create deployment package
      run: |
        mkdir -p deploy-package
        cp -r .output deploy-package/
        cp package*.json deploy-package/
        cp -r public deploy-package/
        tar -czf deploy-package.tar.gz deploy-package/

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: deploy-package.tar.gz
        retention-days: 7

  # Job 3: Deploy to DigitalOcean VPS
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: production
      url: https://tejasm.dev
    
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: build-artifact

    - name: Deploy to DigitalOcean via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        APP_NAME: ${{ env.APP_NAME }}
        DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        envs: APP_NAME,DEPLOY_PATH
        script: |
          echo "🚀 Starting deployment..."
          
          # Create deployment directory if it doesn't exist
          mkdir -p $DEPLOY_PATH
          
          # Backup current version
          if [ -d "$DEPLOY_PATH/current" ]; then
            echo "📦 Backing up current version..."
            mv $DEPLOY_PATH/current $DEPLOY_PATH/backup-$(date +%Y%m%d-%H%M%S)
            # Keep only last 3 backups
            ls -dt $DEPLOY_PATH/backup-* | tail -n +4 | xargs rm -rf
          fi
          
          echo "✅ Deployment preparation complete!"

    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "deploy-package.tar.gz"
        target: ${{ env.DEPLOY_PATH }}

    - name: Extract and start application
      uses: appleboy/ssh-action@v1.0.3
      env:
        APP_NAME: ${{ env.APP_NAME }}
        DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        NODE_ENV: production
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        envs: APP_NAME,DEPLOY_PATH,NODE_ENV
        script: |
          cd $DEPLOY_PATH
          
          echo "📦 Extracting deployment package..."
          tar -xzf deploy-package.tar.gz
          mv deploy-package current
          rm deploy-package.tar.gz
          
          cd current
          
          echo "📥 Installing production dependencies..."
          npm ci --production
          
          echo "🔄 Restarting application with PM2..."
          # Install PM2 globally if not already installed
          command -v pm2 >/dev/null 2>&1 || npm install -g pm2
          
          # Start or restart the app
          if pm2 describe $APP_NAME > /dev/null 2>&1; then
            pm2 restart $APP_NAME --update-env
          else
            pm2 start npm --name $APP_NAME -- start
            pm2 save
          fi
          
          echo "✅ Deployment successful!"
          pm2 status

    - name: Health check
      run: |
        echo "🏥 Performing health check..."
        sleep 10
        # Add your health check URL here
        # curl -f https://tejasm.dev/api/health || exit 1
        echo "✅ Health check passed!"

    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment completed successfully!"
        else
          echo "❌ Deployment failed!"
        fi